<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TV Party Games</title>
  <style>
    :root {
      --bg-color: #121216;
      --panel-bg: #1e1e24;
      --p1-color: #ff4757;
      --p2-color: #2ed573;
      --p3-color: #1e90ff;
      --p4-color: #ffa502;
      --p5-color: #9b59b6;
      --p6-color: #e84393;
      --p7-color: #00d2d3;
      --p8-color: #ff6b81;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: var(--bg-color);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .screen {
      display: none !important;
      height: 100vh;
      width: 100vw;
    }

    .screen.active {
      display: flex !important;
    }

    /* 1. Menu View */
    #menu-view {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
    }

    .menu-btn {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #575fcf;
      color: white;
      -webkit-appearance: none;
    }

    .join-box { display: flex; gap: 0.5rem; }
    .join-box input {
      width: 120px;
      font-size: 1.2rem;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    /* 2. TV View & Debug Bar Layout */
    #tv-view {
      flex-direction: column;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }

    #game-stage {
      flex: 1;
      position: relative;
      background: #000;
      min-height: 0;
    }

    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #debug-bar {
      height: min(120px, 18dvh);
      background: var(--panel-bg);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      padding: 6px;
      border-top: 2px solid #3f3f50;
      box-sizing: border-box;
    }

    .player-card {
      background: #141419;
      border-radius: 6px;
      border-top: 3px solid #333;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      opacity: 0.35;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .player-card.connected {
      opacity: 1;
      border-top-color: var(--p-color);
    }

    .player-label {
      font-size: clamp(0.55rem, 0.9vw, 0.75rem);
      font-weight: 800;
      color: #666;
    }

    .player-card.connected .player-label {
      color: var(--p-color);
    }

    .mini-controller {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
    }

    .mini-dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: min(28px, 4vw);
      height: min(28px, 4vw);
      gap: 1px;
    }

    .mini-key {
      background: #252733;
      border-radius: 1px;
    }

    .mini-key.active {
      background: var(--p-color, #2ed573);
      box-shadow: 0 0 5px var(--p-color, #2ed573);
    }

    .mini-actions {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .mini-btn {
      width: min(10px, 1.8vw);
      height: min(10px, 1.8vw);
      border-radius: 50%;
    }

    .mini-btn.btn-b { border: 1px solid #ff4757; }
    .mini-btn.btn-a { border: 1px solid #2ed573; }

    /* 3. Controller View */
    #controller-view {
      flex-direction: row !important;
      justify-content: space-between;
      align-items: center;
      height: 100dvh;
      width: 100vw;
      padding: 0.75rem 1rem;
      background: radial-gradient(circle at center, #181a24 0%, #0a0b0e 100%);
      box-sizing: border-box;
      overflow: hidden;
    }

    .control-pod {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dpad-container {
      width: min(150px, 38vh);
      height: min(150px, 38vh);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      background: #12131a;
      border-radius: 50%;
      padding: 6px;
      border: 2px solid #232635;
    }

    .dpad-btn {
      background: #1a1c26;
      border: 1px solid #2d3142;
      color: #8a8fbf;
      font-size: min(1rem, 3.5vh);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      -webkit-appearance: none;
      outline: none;
    }

    #btn-up    { grid-column: 2; grid-row: 1; border-radius: 10px 10px 4px 4px; }
    #btn-left  { grid-column: 1; grid-row: 2; border-radius: 10px 4px 4px 10px; }
    #btn-right { grid-column: 3; grid-row: 2; border-radius: 4px 10px 10px 4px; }
    #btn-down  { grid-column: 2; grid-row: 3; border-radius: 4px 4px 10px 10px; }

    .dpad-btn.active {
      background: #575fcf;
      color: #ffffff;
      border-color: #70a1ff;
      box-shadow: 0 0 12px #575fcf;
    }

    .center-pod {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .util-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #8a8fbf;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      cursor: pointer;
    }

    .util-btn:active {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .action-container {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .action-btn {
      width: min(65px, 18vh);
      height: min(65px, 18vh);
      border-radius: 50%;
      background: linear-gradient(145deg, #1e202d, #14151e);
      color: #ffffff;
      font-size: min(1.2rem, 3.5vh);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      outline: none;
    }

    #btn-b { border: 2px solid #ff4757; color: #ff4757; }
    #btn-a { border: 2px solid #2ed573; color: #2ed573; }

    #btn-b.active { background: #ff4757; color: #fff; transform: scale(0.92); }
    #btn-a.active { background: #2ed573; color: #fff; transform: scale(0.92); }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Menu View -->
  <div id="menu-view" class="screen active">
    <h1>TV Party Host</h1>
    <button id="btn-host-tv" class="menu-btn">Host on TV</button>
    <hr style="width:200px; border-color:#333;">
    <div class="join-box">
      <input type="text" id="room-code-input" placeholder="4-digit code" maxlength="4">
      <button id="btn-join-phone" class="menu-btn">Join</button>
    </div>
  </div>

  <!-- TV View -->
  <div id="tv-view" class="screen">
    <div id="game-stage">
      <div style="padding:1rem; color:#aaa; position:absolute; z-index:10; pointer-events:none;">
        ROOM CODE: <strong id="room-code-display" style="color:#fff; font-size:1.5rem;">----</strong>
      </div>
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="debug-bar"></div>
  </div>

  <!-- Controller View -->
  <div id="controller-view" class="screen">
    <div class="control-pod">
      <div class="dpad-container">
        <div></div><button class="dpad-btn" id="btn-up">▲</button><div></div>
        <button class="dpad-btn" id="btn-left">◄</button><div></div><button class="dpad-btn" id="btn-right">►</button>
        <div></div><button class="dpad-btn" id="btn-down">▼</button><div></div>
      </div>
    </div>

    <div class="center-pod">
      <button id="btn-fullscreen" class="util-btn" title="Toggle Fullscreen">⛶</button>
    </div>

    <div class="control-pod">
      <div class="action-container">
        <button class="action-btn" id="btn-b">B</button>
        <button class="action-btn" id="btn-a">A</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
