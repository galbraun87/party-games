<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TV Party Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f1016 0%, #1a1b26 100%);
      --panel-bg: rgba(26, 27, 38, 0.85);
      --p1-color: #ff3366; /* Neon Pink/Red */
      --p2-color: #00e5ff; /* Cyan */
      --p3-color: #ffd500; /* Yellow */
      --p4-color: #b700ff; /* Purple */
      --p5-color: #ff7300; /* Orange */
      --p6-color: #ffffff; /* White */
      --p7-color: #00ff66; /* Neon Green */
      --p8-color: #ff00aa; /* Hot Pink */
    }

    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none; touch-action: none;
    }

    body {
      background: var(--bg-gradient);
      color: #ffffff;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      height: 100dvh; width: 100vw;
    }

    .screen { display: none !important; height: 100dvh; width: 100vw; }
    .screen.active { display: flex !important; }

    /* --- 1. Menu View --- */
    #menu-view {
      flex-direction: column; justify-content: center; align-items: center;
      gap: 1.5rem;
      background: radial-gradient(circle at top, #2b2e4a, #0f1016);
    }

    #menu-view h1 {
      font-size: 3rem; font-weight: 900;
      background: linear-gradient(90deg, #00e5ff, #b700ff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 10px rgba(0, 229, 255, 0.3));
      margin-bottom: 1rem;
    }

    .menu-btn {
      padding: 1rem 2.5rem; font-size: 1.2rem; font-weight: 700; font-family: inherit;
      border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, #575fcf, #3c40c6);
      color: white; box-shadow: 0 4px 15px rgba(87, 95, 207, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .menu-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(87, 95, 207, 0.4); }

    .join-box {
      display: flex; flex-direction: column; gap: 1rem; align-items: center;
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px);
      padding: 2rem; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .join-box input {
      width: 220px; padding: 0.85rem; font-size: 1.1rem; text-align: center; font-family: inherit; font-weight: 700;
      border-radius: 10px; border: 2px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.3); color: white; transition: border-color 0.2s;
    }
    .join-box input:focus { outline: none; border-color: #00e5ff; }

    /* --- 2. TV View --- */
    #tv-view { flex-direction: column; height: 100dvh; width: 100vw; overflow: hidden; background: #000; }
    
    #game-stage {
      flex: 1; position: relative; background: #000;
      display: flex; justify-content: center; align-items: center; min-height: 0;
    }

    #game-canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; object-fit: contain; }

    .room-code-tag {
      position: absolute; top: 1.5rem; right: 1.5rem; z-index: 10;
      background: rgba(15, 16, 22, 0.75); backdrop-filter: blur(10px);
      padding: 0.5rem 1.25rem; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 1rem; font-weight: 700; color: #aaa; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #debug-bar {
      height: min(120px, 18dvh); background: var(--panel-bg); backdrop-filter: blur(10px);
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px;
      padding: 8px; border-top: 1px solid rgba(255, 255, 255, 0.05); box-sizing: border-box;
    }

    .player-card {
      background: rgba(0,0,0,0.4); border-radius: 10px;
      border-top: 4px solid #333; padding: 6px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-around;
      opacity: 0.3; transition: all 0.3s;
    }

    .player-card.connected { opacity: 1; border-top-color: var(--p-color); background: rgba(255,255,255,0.03); }
    
    /* Stage 1 Timeout UI state */
    .player-card.connected.inactive {
      opacity: 0.35;
      filter: grayscale(80%);
      border-top-color: #555;
    }

    .player-label {
      font-size: clamp(0.6rem, 1vw, 0.85rem); font-weight: 900; color: #555;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; text-transform: uppercase;
    }
    .player-card.connected .player-label { color: var(--p-color); text-shadow: 0 0 8px rgba(var(--p-color), 0.5); }

    /* Debug Controller Visuals */
    .mini-controller { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 4px; }
    .mini-dpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: min(32px, 4.5vw); height: min(32px, 4.5vw); gap: 2px; }
    
    .mini-key { background: transparent; border-radius: 2px; }
    .mini-key.dir { background: #2a2c3a; }
    .mini-key.dir.active { background: var(--p-color); box-shadow: 0 0 8px var(--p-color); }
    
    .mini-actions { display: flex; gap: 4px; align-items: center; }
    .mini-btn { width: min(12px, 2vw); height: min(12px, 2vw); border-radius: 50%; transition: all 0.1s; }
    .mini-btn.btn-b { border: 2px solid #ff3366; }
    .mini-btn.btn-b.active { background: #ff3366; box-shadow: 0 0 8px #ff3366; }
    .mini-btn.btn-a { border: 2px solid #00ff66; }
    .mini-btn.btn-a.active { background: #00ff66; box-shadow: 0 0 8px #00ff66; }

    /* --- 3. Controller View (Portrait & Landscape Autoscaling) --- */
    #controller-view {
      display: flex; justify-content: space-between; align-items: center;
      height: 100dvh; width: 100vw; padding: 1.5rem 3rem; box-sizing: border-box;
      background: radial-gradient(circle at center, #1e2030 0%, #0a0b0e 100%);
    }

    @media (orientation: portrait) {
      #controller-view {
        flex-direction: column !important;
        justify-content: space-evenly;
        padding: 4rem 1rem;
      }
      .dpad-container { width: min(280px, 70vw) !important; height: min(280px, 70vw) !important; }
      .action-container { gap: 2rem !important; }
      .action-btn { width: min(100px, 25vw) !important; height: min(100px, 25vw) !important; }
    }

    .control-pod {
      background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 30px;
      padding: 16px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 2px 5px rgba(255,255,255,0.05);
      display: flex; justify-content: center; align-items: center;
    }

    .dpad-container {
      width: min(240px, 45vh); height: min(240px, 45vh);
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 6px;
      background: #141622; border-radius: 50%; padding: 8px; border: 3px solid #242738;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.5);
    }

    .dpad-btn {
      background: linear-gradient(180deg, #242738, #1a1c29); border: none;
      color: #6a6f94; font-size: clamp(1.5rem, 4vh, 2.5rem); font-family: inherit;
      display: flex; align-items: center; justify-content: center;
      -webkit-appearance: none; outline: none; box-shadow: 0 4px 0 #0f1016; transition: all 0.05s;
    }

    #btn-up    { grid-column: 2; grid-row: 1; border-radius: 18px 18px 6px 6px; }
    #btn-left  { grid-column: 1; grid-row: 2; border-radius: 18px 6px 6px 18px; }
    #btn-right { grid-column: 3; grid-row: 2; border-radius: 6px 18px 18px 6px; }
    #btn-down  { grid-column: 2; grid-row: 3; border-radius: 6px 6px 18px 18px; }

    .dpad-btn.active {
      background: #575fcf; color: #ffffff; box-shadow: 0 0px 0 #0f1016, 0 0 20px rgba(87,95,207,0.6);
      transform: translateY(4px); text-shadow: 0 0 10px white;
    }

    .center-pod { display: flex; align-items: center; justify-content: center; }

    .util-btn {
      width: 55px; height: 55px; border-radius: 16px; font-family: inherit;
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1);
      color: #6a6f94; font-size: 1.5rem; outline: none; cursor: pointer; transition: 0.2s;
    }
    .util-btn:active { background: rgba(255, 255, 255, 0.15); color: #fff; transform: scale(0.95); }

    .action-container { display: flex; gap: 1.5rem; align-items: center; }

    .action-btn {
      width: min(90px, 20vh); height: min(90px, 20vh); border-radius: 50%; font-family: inherit;
      background: linear-gradient(135deg, #242738, #151722); color: #ffffff;
      font-size: clamp(1.5rem, 4vh, 2rem); font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      -webkit-appearance: none; outline: none; transition: all 0.05s;
      box-shadow: 0 6px 0 #0a0b0f, inset 0 2px 4px rgba(255,255,255,0.1);
    }

    #btn-b { border: 2px solid #ff3366; color: #ff3366; }
    #btn-a { border: 2px solid #00ff66; color: #00ff66; }

    #btn-b.active { background: #ff3366; color: #fff; box-shadow: 0 0px 0 #0a0b0f, 0 0 25px rgba(255,51,102,0.5); transform: translateY(6px); }
    #btn-a.active { background: #00ff66; color: #000; box-shadow: 0 0px 0 #0a0b0f, 0 0 25px rgba(0,255,102,0.5); transform: translateY(6px); }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="menu-view" class="screen active">
    <h1>TV Party Host</h1>
    <button id="btn-host-tv" class="menu-btn">Host Game on TV</button>
    <div style="width:260px; height:2px; background:rgba(255,255,255,0.05); margin: 1rem 0;"></div>
    <div class="join-box">
      <input type="text" id="player-name-input" placeholder="Your Name" maxlength="10">
      <input type="text" id="room-code-input" placeholder="4-Digit TV Code" maxlength="4" style="text-transform: uppercase;">
      <button id="btn-join-phone" class="menu-btn" style="width: 100%; background: linear-gradient(135deg, #00e5ff, #0088ff);">Join Match</button>
    </div>
  </div>

  <div id="tv-view" class="screen">
    <div id="game-stage">
      <div class="room-code-tag">
        JOIN CODE: <strong id="room-code-display" style="color:#00e5ff; font-size:1.4rem; letter-spacing: 2px;">----</strong>
      </div>
      <canvas id="game-canvas" width="1280" height="720"></canvas>
    </div>
    <div id="debug-bar"></div>
  </div>

  <div id="controller-view" class="screen">
    <div class="control-pod">
      <div class="dpad-container">
        <div></div><button class="dpad-btn" id="btn-up">▲</button><div></div>
        <button class="dpad-btn" id="btn-left">◄</button><div></div><button class="dpad-btn" id="btn-right">►</button>
        <div></div><button class="dpad-btn" id="btn-down">▼</button><div></div>
      </div>
    </div>
    <div class="center-pod">
      <button id="btn-fullscreen" class="util-btn" title="Toggle Fullscreen">⛶</button>
    </div>
    <div class="control-pod">
      <div class="action-container">
        <button class="action-btn" id="btn-b">B</button>
        <button class="action-btn" id="btn-a">A</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js?v=9"></script>
</body>
</html>
